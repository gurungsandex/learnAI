<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="#0A0714"/>

  <!-- Antenna -->
  <line x1="32" y1="6" x2="32" y2="16" stroke="#888" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="4" fill="#FBBF24"/>

  <!-- Head -->
  <rect x="12" y="15" width="40" height="30" rx="10" fill="#22D3EE"/>
  <rect x="12" y="15" width="40" height="30" rx="10" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Screen face -->
  <rect x="17" y="20" width="30" height="20" rx="6" fill="#0A0714"/>

  <!-- Eyes -->
  <circle cx="24" cy="30" r="5" fill="white"/>
  <circle cx="24" cy="30" r="3" fill="#111"/>
  <circle cx="25" cy="29" r="1" fill="white"/>

  <circle cx="40" cy="30" r="5" fill="white"/>
  <circle cx="40" cy="30" r="3" fill="#111"/>
  <circle cx="41" cy="29" r="1" fill="white"/>

  <!-- Smile -->
  <path d="M25 38 Q32 43 39 38" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="18" y="44" width="28" height="14" rx="7" fill="#22D3EE"/>
  <rect x="18" y="44" width="28" height="14" rx="7" fill="none" stroke="#111" stroke-width="2"/>

  <!-- Chest light -->
  <circle cx="32" cy="51" r="3.5" fill="#FBBF24"/>
</svg>
